# FITRA-AAA nRF54L15 (cpuapp) application config overrides

# USB はハードウェア的に未統合のため、グローバルの設定を上書きして無効化
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_HID=n
CONFIG_USB_CDC_ACM=n

# --- Logging: RTT を既定にし、UART20 ログバックエンドは停止してバッテリーを節約。
# ログ（と SlimeVR コンソール入力）は SEGGER RTT へ。RTT はデバッガ接続時のみ
# 電力を消費（RAM リングバッファ）。UART20 でログを見たい場合は AUTOSTART=y ＋
# LOG_DEFAULT_LEVEL を上げてリビルド。
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SENSOR_LOG_LEVEL_WRN=y
# Disable SPI driver debug logs to reduce log buffer usage
CONFIG_SPI_LOG_LEVEL_INF=y
# Reduce log buffer (was 4096) since UART backend is off and sensor logs are at WRN
CONFIG_LOG_BUFFER_SIZE=1536

# Required for timing on nRF54L series
CONFIG_NRF_GRTC_START_SYSCOUNTER=y

# FITRA-AAA battery path uses nPM2100 VBAT readings with a 1-cell NiMH mapping
CONFIG_SENSOR=y
CONFIG_REGULATOR=y
CONFIG_NPM2100_VBAT=y
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=100
CONFIG_BATTERY_USE_NIMH_MAPPING=y
CONFIG_LED_RGB_COLOR=y

# --- ESB 送信電力を 0 dBm に下げて送信電流を最小化（体装着・受信機近傍用途を想定）。
# 到達距離/信頼性が落ちる場合は 3〜4 などに戻す。CONFIG_RADIO_TX_POWER は実行時設定
# (CONFIG_2_RADIO_TX_POWER) の初期値のため、既ブート個体では reset_config all で再適用。
CONFIG_RADIO_TX_POWER=0
CONFIG_ESB_CLOCK_INIT=y

# --- 静止時のセンサ低消費電力モード(低ODR)への移行をやや速く(WOMスリープとは別)。
# これは動作中の省電力(WOM無効でも有効)。runtime settings の初期値(reset_config all で再適用)。
# SENSOR_LP_TIMEOUT: 500 -> 300 ms
CONFIG_SENSOR_LP_TIMEOUT=300

# --- WOM(モーション起こし)スリープは復帰不具合のため一時的に無効化。
# USE_IMU_WAKE_UP=n でWOM要求パスを切る。int0-gpios のデータready割り込み
# (動作中のMCUスリープ=主な省電力)は残存する。復帰問題解決後に y に戻し、
# WOM用タイムアウト(IMU_TIMEOUT_RAMP_*, ACTIVE_TIMEOUT_DELAY)を再設定すること。
CONFIG_USE_IMU_WAKE_UP=n

# nRF54L15 starts up with HW stack protection enabled; too-small stacks
# can overflow immediately (UsageFault STKOF -> forced HardFault).
CONFIG_MAIN_STACK_SIZE=4096

# Interrupt/exception stack (MSP). The default (1024) is too small here and
# we hit STKOF very early during exception handling.
CONFIG_ISR_STACK_SIZE=8192